# Bounds the journal that holds the API and worker logs. Install to /etc/systemd/journald.conf.d/veyrogram.conf (install.sh does), then
# `systemctl restart systemd-journald`. Without a bound the journal can fill the disk that MySQL and the IM server share.
[Journal]
Storage=persistent
SystemMaxUse=2G
SystemKeepFree=4G
SystemMaxFileSize=128M
MaxRetentionSec=30day
Compress=yes
RateLimitIntervalSec=30s
RateLimitBurst=10000
