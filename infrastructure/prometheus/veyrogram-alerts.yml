# Prometheus alert rules (Story 1.5). Thresholds are conservative starting points, NOT tuned against real traffic.
# Route "severity: page" alerts to the operations channel in Alertmanager (configuration lives with the operator, not in this repo).
groups:
  - name: veyrogram-api
    rules:
      - alert: VeyroGramApiDown
        expr: up{job="veyrogram-api"} == 0
        for: 2m
        labels: { severity: page }
        annotations: { summary: "veyrogram-api is not being scraped (down or /metrics token wrong)" }
      - alert: VeyroGramHighErrorRate
        expr: sum(rate(vg_http_requests_total{class="5xx"}[5m])) / clamp_min(sum(rate(vg_http_requests_total[5m])), 1) > 0.05
        for: 10m
        labels: { severity: page }
        annotations: { summary: "More than 5% of HTTP requests return 5xx" }
      - alert: VeyroGramSlowRequests
        expr: histogram_quantile(0.95, sum(rate(vg_http_request_duration_seconds_bucket[5m])) by (le)) > 1
        for: 10m
        labels: { severity: ticket }
        annotations: { summary: "p95 request latency above 1s" }
      - alert: VeyroGramDeliveryLatencyHigh
        expr: histogram_quantile(0.95, sum(rate(vg_message_delivery_latency_seconds_bucket[5m])) by (le)) > 2
        for: 10m
        labels: { severity: page }
        annotations: { summary: "p95 message delivery latency above 2s" }
      - alert: VeyroGramDbPoolSaturated
        expr: vg_db_pool_in_use_connections >= 0.9 * vg_db_pool_open_connections and vg_db_pool_open_connections > 0
        for: 5m
        labels: { severity: ticket }
        annotations: { summary: "DB connection pool is above 90% in use" }
      - alert: VeyroGramOutboxBacklog
        expr: vg_outbox_pending > 1000
        for: 10m
        labels: { severity: page }
        annotations: { summary: "Outbox backlog above 1000 pending rows" }
      - alert: VeyroGramPushErrors
        expr: sum(rate(vg_push_errors_total{provider!="none"}[10m])) > 0.5
        for: 10m
        labels: { severity: ticket }
        annotations: { summary: "Push provider errors above 0.5/s" }
      - alert: VeyroGramImWebhookRejected
        expr: sum(increase(vg_im_webhook_rejected_total[5m])) > 0
        for: 0m
        labels: { severity: page }
        annotations: { summary: "IM callback listener rejected requests (bad secret/source/shape): possible probing or a misconfigured IM" }
      - alert: VeyroGramImgwErrors
        expr: sum(rate(vg_imgw_calls_total{result="error"}[5m])) > 0.1
        for: 5m
        labels: { severity: page }
        annotations: { summary: "imgw calls to the IM API are failing (IM down or overloaded)" }
      - alert: VeyroGramDenylistDegraded
        expr: sum(increase(vg_auth_denylist_degraded_total[5m])) > 0
        for: 2m
        labels: { severity: page }
        annotations: { summary: "Redis token deny-list unreachable: device revocation only takes effect when access tokens expire (<= 15 min)" }
      - alert: VeyroGramAuthRiskEvents
        expr: sum(increase(vg_auth_events_total{result=~"reuse|locked"}[10m])) > 20
        for: 0m
        labels: { severity: ticket }
        annotations: { summary: "Many login lockouts or refresh-token reuse detections: possible credential stuffing or token theft" }
      - alert: VeyroGramSendGateFailClosed
        expr: sum(increase(vg_message_gate_total{result=~"error|timeout"}[5m])) > 0
        for: 2m
        labels: { severity: page }
        annotations: { summary: "The send-policy gate could not decide (error/timeout) and is denying messages fail-closed: users see send failures. Check MySQL and the before_send latency budget" }
      - alert: VeyroGramAdminProbing
        expr: sum(increase(vg_admin_denied_total{reason=~"unauthenticated|forbidden|ip_not_allowed"}[10m])) > 30
        for: 0m
        labels: { severity: page }
        annotations: { summary: "Many refused requests on the admin plane (unauthenticated, forbidden or outside the allowlist): someone is probing it. Check the audit log for admin.login.failed / admin.locked" }
      - alert: VeyroGramProbeDown
        expr: veyrogram_probe_up == 0
        for: 3m
        labels: { severity: page }
        annotations: { summary: "The health probe has found {{ $labels.target }} not answering for 3 minutes (api = readiness incl. MySQL, worker, im). Run `veyrogram-api probe` on the host and check the unit's journal" }
      - alert: VeyroGramProbeStale
        expr: time() - veyrogram_probe_timestamp_seconds > 300
        for: 0m
        labels: { severity: page }
        annotations: { summary: "The health probe has not reported for over 5 minutes: veyrogram-probe.timer stopped or the host's textfile collector is not being scraped. Without it a down API is only seen by the scrape alert" }
      - alert: VeyroGramBackupFailed
        expr: (veyrogram_backup_last_failure_timestamp_seconds > veyrogram_backup_last_success_timestamp_seconds) or (veyrogram_backup_last_failure_timestamp_seconds unless on(kind) veyrogram_backup_last_success_timestamp_seconds)
        for: 10m
        labels: { severity: page }
        annotations: { summary: "The latest {{ $labels.kind }} backup run failed (nothing newer succeeded). Read the unit's journal: journalctl -u veyrogram-backup-{{ $labels.kind }}" }
      - alert: VeyroGramBackupStale
        expr: (time() - veyrogram_backup_last_success_timestamp_seconds{kind=~"mysql-full|im"} > 93600) or (time() - veyrogram_backup_last_success_timestamp_seconds{kind="mysql-binlog"} > 1200)
        for: 0m
        labels: { severity: page }
        annotations: { summary: "No successful {{ $labels.kind }} backup for too long (full/IM: 26 h, binlog: 20 min — the binlog figure is the database's data-loss window). The timer may have stopped" }
      - alert: VeyroGramBackupMetricsMissing
        expr: absent(veyrogram_backup_last_success_timestamp_seconds{kind="mysql-full"})
        for: 30m
        labels: { severity: page }
        annotations: { summary: "There is no mysql-full backup success metric at all: backups never ran, or the textfile collector is not scraped. Assume there is NO backup until proven otherwise" }
