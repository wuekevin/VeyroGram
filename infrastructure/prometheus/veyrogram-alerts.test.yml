rule_files: [veyrogram-alerts.yml]
evaluation_interval: 1m
tests:
  - name: api down fires after 2m
    interval: 1m
    input_series:
      - series: 'up{job="veyrogram-api"}'
        values: '1 0 0 0 0'
    alert_rule_test:
      - eval_time: 1m
        alertname: VeyroGramApiDown
        exp_alerts: []
      - eval_time: 4m
        alertname: VeyroGramApiDown
        exp_alerts:
          - exp_labels: { severity: page, job: veyrogram-api }
            exp_annotations: { summary: "veyrogram-api is not being scraped (down or /metrics token wrong)" }
  - name: 5xx ratio above 5 percent for 10m fires; healthy traffic does not
    interval: 1m
    input_series:
      - series: 'vg_http_requests_total{method="GET",class="5xx"}'
        values: '0+10x20'
      - series: 'vg_http_requests_total{method="GET",class="2xx"}'
        values: '0+90x20'
    alert_rule_test:
      - eval_time: 20m
        alertname: VeyroGramHighErrorRate
        exp_alerts:
          - exp_labels: { severity: page }
            exp_annotations: { summary: "More than 5% of HTTP requests return 5xx" }
  - name: low error ratio stays silent
    interval: 1m
    input_series:
      - series: 'vg_http_requests_total{method="GET",class="5xx"}'
        values: '0+1x20'
      - series: 'vg_http_requests_total{method="GET",class="2xx"}'
        values: '0+99x20'
    alert_rule_test:
      - eval_time: 20m
        alertname: VeyroGramHighErrorRate
        exp_alerts: []
  - name: any IM webhook rejection pages immediately
    interval: 1m
    input_series:
      - series: 'vg_im_webhook_rejected_total{reason="bad_secret"}'
        values: '0 0 3 3 3'
    alert_rule_test:
      - eval_time: 3m
        alertname: VeyroGramImWebhookRejected
        exp_alerts:
          - exp_labels: { severity: page }
            exp_annotations: { summary: "IM callback listener rejected requests (bad secret/source/shape): possible probing or a misconfigured IM" }
  - name: outbox backlog
    interval: 1m
    input_series:
      - series: 'vg_outbox_pending'
        values: '2000x15'
    alert_rule_test:
      - eval_time: 12m
        alertname: VeyroGramOutboxBacklog
        exp_alerts:
          - exp_labels: { severity: page }
            exp_annotations: { summary: "Outbox backlog above 1000 pending rows" }
  - name: deny-list degradation pages after 2m
    interval: 1m
    input_series:
      - series: 'vg_auth_denylist_degraded_total'
        values: '0 0 5 10 15 20 25'
    alert_rule_test:
      - eval_time: 2m
        alertname: VeyroGramDenylistDegraded
        exp_alerts: []
      - eval_time: 6m
        alertname: VeyroGramDenylistDegraded
        exp_alerts:
          - exp_labels: { severity: page }
            exp_annotations: { summary: "Redis token deny-list unreachable: device revocation only takes effect when access tokens expire (<= 15 min)" }
  - name: healthy deny-list stays silent
    interval: 1m
    input_series:
      - series: 'vg_auth_denylist_degraded_total'
        values: '0 0 0 0 0 0 0'
    alert_rule_test:
      - eval_time: 6m
        alertname: VeyroGramDenylistDegraded
        exp_alerts: []
  - name: send gate fail-closed pages
    interval: 1m
    input_series:
      - series: 'vg_message_gate_total{rule="accounts",result="timeout"}'
        values: '0 0 0 5 9 14 20 20'
    alert_rule_test:
      - eval_time: 2m
        alertname: VeyroGramSendGateFailClosed
        exp_alerts: []
      - eval_time: 7m
        alertname: VeyroGramSendGateFailClosed
        exp_alerts:
          - exp_labels: { severity: page }
            exp_annotations: { summary: "The send-policy gate could not decide (error/timeout) and is denying messages fail-closed: users see send failures. Check MySQL and the before_send latency budget" }
  - name: healthy send gate stays silent
    interval: 1m
    input_series:
      - series: 'vg_message_gate_total{rule="accounts",result="allow"}'
        values: '0 10 40 90 150 210 300'
    alert_rule_test:
      - eval_time: 6m
        alertname: VeyroGramSendGateFailClosed
        exp_alerts: []
  - name: admin plane probing pages
    interval: 1m
    input_series:
      - series: 'vg_admin_denied_total{reason="unauthenticated"}'
        values: '0 0 5 20 45 80 120 120 120 120 120 120'
    alert_rule_test:
      - eval_time: 2m
        alertname: VeyroGramAdminProbing
        exp_alerts: []
      - eval_time: 6m
        alertname: VeyroGramAdminProbing
        exp_alerts:
          - exp_labels: { severity: page }
            exp_annotations: { summary: "Many refused requests on the admin plane (unauthenticated, forbidden or outside the allowlist): someone is probing it. Check the audit log for admin.login.failed / admin.locked" }
  - name: quiet admin plane stays silent
    interval: 1m
    input_series:
      - series: 'vg_admin_denied_total{reason="unauthenticated"}'
        values: '0 1 1 2 2 3 3'
    alert_rule_test:
      - eval_time: 6m
        alertname: VeyroGramAdminProbing
        exp_alerts: []
  - name: probe sees a target down
    interval: 1m
    input_series:
      - series: 'veyrogram_probe_up{target="api"}'
        values: '1 1 0 0 0 0 0 0'
      - series: 'veyrogram_probe_up{target="im"}'
        values: '1 1 1 1 1 1 1 1'
    alert_rule_test:
      - eval_time: 3m
        alertname: VeyroGramProbeDown
        exp_alerts: []
      - eval_time: 6m
        alertname: VeyroGramProbeDown
        exp_alerts:
          - exp_labels: { severity: page, target: api }
            exp_annotations: { summary: "The health probe has found api not answering for 3 minutes (api = readiness incl. MySQL, worker, im). Run `veyrogram-api probe` on the host and check the unit's journal" }
  - name: a stopped probe is itself an alert
    interval: 1m
    input_series:
      - series: 'veyrogram_probe_timestamp_seconds'
        values: '0 60 120 180 180 180 180 180 180 180'
    alert_rule_test:
      - eval_time: 3m
        alertname: VeyroGramProbeStale
        exp_alerts: []
      - eval_time: 9m
        alertname: VeyroGramProbeStale
        exp_alerts:
          - exp_labels: { severity: page }
            exp_annotations: { summary: "The health probe has not reported for over 5 minutes: veyrogram-probe.timer stopped or the host's textfile collector is not being scraped. Without it a down API is only seen by the scrape alert" }
  - name: a failed backup run pages, a later success clears it
    interval: 1m
    input_series:
      - series: 'veyrogram_backup_last_success_timestamp_seconds{kind="mysql-full"}'
        values: '100 100 100 100 100 100 100 100 100 100 100 100 100 100 100 100 100 100 100 100 100 100 100 100 100 100 100 100 100 100 100 100 100 100'
      - series: 'veyrogram_backup_last_failure_timestamp_seconds{kind="mysql-full"}'
        values: '0 0 0 200 200 200 200 200 200 200 200 200 200 200 200 200 200 200 200 200 200 200 200 200 200 200 200 200 200 200 200 200 200 200'
    alert_rule_test:
      - eval_time: 5m
        alertname: VeyroGramBackupFailed
        exp_alerts: []
      - eval_time: 15m
        alertname: VeyroGramBackupFailed
        exp_alerts:
          - exp_labels: { severity: page, kind: mysql-full }
            exp_annotations: { summary: "The latest mysql-full backup run failed (nothing newer succeeded). Read the unit's journal: journalctl -u veyrogram-backup-mysql-full" }
  - name: a backup that never succeeded and failed is still a failure
    interval: 1m
    input_series:
      - series: 'veyrogram_backup_last_failure_timestamp_seconds{kind="im"}'
        values: '50+0x20'
    alert_rule_test:
      - eval_time: 15m
        alertname: VeyroGramBackupFailed
        exp_alerts:
          - exp_labels: { severity: page, kind: im }
            exp_annotations: { summary: "The latest im backup run failed (nothing newer succeeded). Read the unit's journal: journalctl -u veyrogram-backup-im" }
  - name: stale binlog shipment pages within 20 minutes, a fresh one does not
    interval: 1m
    input_series:
      - series: 'veyrogram_backup_last_success_timestamp_seconds{kind="mysql-binlog"}'
        values: '0 60 120 180 240 300 300 300 300 300 300 300 300 300 300 300 300 300 300 300 300 300 300 300 300 300 300 300'
    alert_rule_test:
      - eval_time: 10m
        alertname: VeyroGramBackupStale
        exp_alerts: []
      - eval_time: 26m
        alertname: VeyroGramBackupStale
        exp_alerts:
          - exp_labels: { severity: page, kind: mysql-binlog }
            exp_annotations: { summary: "No successful mysql-binlog backup for too long (full/IM: 26 h, binlog: 20 min — the binlog figure is the database's data-loss window). The timer may have stopped" }
  - name: no backup metric at all pages
    interval: 1m
    input_series:
      - series: 'up{job="veyrogram-api"}'
        values: '1+0x60'
    alert_rule_test:
      - eval_time: 20m
        alertname: VeyroGramBackupMetricsMissing
        exp_alerts: []
      - eval_time: 45m
        alertname: VeyroGramBackupMetricsMissing
        exp_alerts:
          - exp_labels: { severity: page, kind: mysql-full }
            exp_annotations: { summary: "There is no mysql-full backup success metric at all: backups never ran, or the textfile collector is not scraped. Assume there is NO backup until proven otherwise" }
