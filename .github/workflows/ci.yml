# Merge gates (Story 1.2). Make every job a *required status check* in the repository's branch protection settings — that setting lives in
# GitHub, not in this file. Mirrors tools/ci_local.sh. DRAFT: not yet run on GitHub Actions.
name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
env:
  GOTOOLCHAIN: go1.26.11      # WuKongIM needs 1.26.x (fails on 1.27); 1.26.11 fixes GO-2026-6859; keep the business service on the same toolchain
jobs:
  go:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: services/api } }
    services:
      mysql:
        image: mysql:8.0            # integration tests need real MySQL 8.0 (not 8.4); CI-only container, production is native
        env: { MYSQL_ROOT_PASSWORD: ci-only-root, MYSQL_ROOT_HOST: '%' }
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-only-root" --health-interval=5s --health-timeout=5s --health-retries=20
      redis:
        image: redis:7.4              # token deny-list tests (Story 1.13); CI-only container, production is native Redis 7.x
        ports: ['6379:6379']
        options: >-
          --health-cmd="redis-cli ping" --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.26.11', cache-dependency-path: services/api/go.mod }
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - name: fetch pinned WuKongIM (SHA recorded in tools/build_wukongim.sh)
        working-directory: .
        run: |
          pin=$(sed -n 's/^PIN=//p' tools/build_wukongim.sh)
          mkdir -p upstream && git clone --quiet https://github.com/WuKongIM/WuKongIM.git upstream/WuKongIM
          git -C upstream/WuKongIM checkout --quiet "$pin"
          bash tools/build_wukongim.sh "$RUNNER_TEMP/wukongim"
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: IM SDK interop test dependencies (the exact wukongimjssdk the Web client ships)
        working-directory: tests/imsdk/web
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: test (race) incl. AD-1 import-direction check and WuKongIM contract tests
        env: { VG_TEST_MYSQL_DSN: 'root:ci-only-root@tcp(127.0.0.1:3306)/', VG_TEST_REDIS_ADDR: '127.0.0.1:6379', VG_REQUIRE_IMSDK: '1' }
        run: VG_TEST_WUKONGIM_BIN="$RUNNER_TEMP/wukongim" go test -race -count=1 ./...
      - name: backup and restore rehearsal (real MySQL source with binlog, scratch mysqld target, real encryption); skips itself if the runner cannot start a second mysqld
        working-directory: .
        env: { VG_TEST_MYSQL_ADMIN_DSN: 'root:ci-only-root@tcp(127.0.0.1:3306)/' }
        run: bash tests/ops/test_backup.sh
  alerts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: promtool check and unit tests
        run: |
          v=2.55.1
          curl -fsSL "https://github.com/prometheus/prometheus/releases/download/v${v}/prometheus-${v}.linux-amd64.tar.gz" | tar xz -C "$RUNNER_TEMP"
          cd infrastructure/prometheus
          "$RUNNER_TEMP/prometheus-${v}.linux-amd64/promtool" check rules veyrogram-alerts.yml
          "$RUNNER_TEMP/prometheus-${v}.linux-amd64/promtool" test rules veyrogram-alerts.test.yml
  supply-chain:
    # Story 1.24: SBOM, vulnerability scan, licence gate, secret scan, mirror ban. Anything found blocks the merge; the only way past a licence finding is an
    # entry in tools/supplychain-waivers.yaml (reason, approver, expiry), and for a secret finding tools/secret-scan-allow.yaml (one value, one file).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v5
        with: { go-version: '1.26.11', cache-dependency-path: services/api/go.mod }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pyyaml
      - run: python3 -I tests/ops/test_supplychain.py
      - name: SBOM (CycloneDX) of what the build links
        run: python3 -I tools/supplychain.py sbom -o "$RUNNER_TEMP/veyrogram-api.cdx.json"
      - uses: actions/upload-artifact@v4
        with: { name: sbom-veyrogram-api, path: '${{ runner.temp }}/veyrogram-api.cdx.json', retention-days: 90 }
      - name: licence gate (UNLICENSED, unknown, custom/commercial and copyleft block)
        run: python3 -I tools/supplychain.py licenses
      - name: official registries only (no third-party mirrors)
        run: python3 -I tools/supplychain.py mirrors
      - name: secret scan
        run: python3 -I tools/secret_scan.py
      - name: vulnerability scan (govulncheck, reachability-aware; the Go standard library is included)
        run: cd services/api && go install golang.org/x/vuln/cmd/govulncheck@v1.1.4 && "$(go env GOPATH)/bin/govulncheck" ./...
  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v5
        with: { go-version: '1.26.11' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pyyaml
      - run: sudo apt-get update && sudo apt-get install -y nginx openssl curl logrotate && sudo systemctl stop nginx || true
      - run: python3 -I tools/lint_infra.py
      - run: python3 -I tests/ops/test_lint_infra.py
      - run: python3 -I tests/ops/test_openapi_diff.py
      - run: python3 -I tests/ops/test_gen_clients.py
      - name: API clients are generated from the current contract
        run: python3 -I tools/gen_clients.py --check
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: API clients compile (go, typescript)
        run: bash tools/check_clients.sh
      - run: python3 -I tools/check_upstream_compat.py
      - run: python3 -I tests/ops/test_upstream_compat.py
      - name: OpenAPI diff vs base branch (breaking changes need a MAJOR bump or an ADR)
        run: python3 -I tools/openapi_diff.py --dir packages/contracts/openapi --base-ref "origin/${{ github.base_ref || 'main' }}"
      - run: bash tests/ops/test_deploy.sh
      - run: bash tests/ops/test_install.sh
      - run: bash tests/ops/test_canary.sh
      - run: bash tests/ops/test_objectstore.sh
      - run: bash tests/ops/test_nginx.sh
      - name: exposure gate - fetch pinned WuKongIM and run config-check + live port scan (fails if any internal port is reachable)
        run: |
          pin=$(sed -n 's/^PIN=//p' tools/build_wukongim.sh)
          mkdir -p upstream && git clone --quiet https://github.com/WuKongIM/WuKongIM.git upstream/WuKongIM
          git -C upstream/WuKongIM checkout --quiet "$pin"
          bash tools/build_wukongim.sh "$RUNNER_TEMP/wukongim"
          VG_TEST_WUKONGIM_BIN="$RUNNER_TEMP/wukongim" python3 -I tests/ops/test_exposure.py
  clients:
    # Story 1.10: Web/desktop and Manager build from a pinned upstream SHA + patch queue (apps/*/patches), frozen install from the official registries.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - run: npm install -g pnpm@12
      - run: python3 -I tests/ops/test_clients.py
      - name: fetch pinned upstream clients
        run: |
          mkdir -p upstream
          git clone --quiet https://github.com/TangSengDaoDao/TangSengDaoDaoWeb.git upstream/TangSengDaoDaoWeb
          git clone --quiet https://github.com/TangSengDaoDao/TangSengDaoDaoManager.git upstream/TangSengDaoDaoManager
      - name: Web + desktop (frozen install, audit gate, build, Electron config check, runtime smoke under xvfb)
        timeout-minutes: 20
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb libgbm1 libasound2t64 libgtk-3-0 libnss3
          VG_ELECTRON_SMOKE=1 VG_ELECTRON_FLAGS="--no-sandbox --disable-gpu" VG_RENDER_ELECTRON="$RUNNER_TEMP/web/node_modules/.bin/electron" xvfb-run -a bash tools/build_clients.sh web "$RUNNER_TEMP/web"
      - name: Manager (frozen install, audit gate, build, render smoke)
        timeout-minutes: 15
        run: VG_ELECTRON_FLAGS="--no-sandbox --disable-gpu" VG_RENDER_ELECTRON="$RUNNER_TEMP/web/node_modules/.bin/electron" xvfb-run -a bash tools/build_clients.sh manager "$RUNNER_TEMP/manager"
      - name: Reproducibility - a second clean build gives the same output hash
        run: |
          a=$(VG_SKIP_AUDIT=1 bash tools/build_clients.sh manager "$RUNNER_TEMP/manager2" | sed -n 's/.*sha256 //p')
          b=$(bash tools/build_clients.sh manager "$RUNNER_TEMP/manager3" | sed -n 's/.*sha256 //p')
          echo "$a $b"; test -n "$a" && test "$a" = "$b"

  android:
    # Story 1.9: unsigned debug APK from a pinned upstream SHA + patch queue, Gradle dependency audit, JVM unit tests, reproducibility.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - run: python3 -I tests/ops/test_mobile_gates.py
      - name: Kotlin API client - compile and contract tests
        timeout-minutes: 15
        run: cd packages/clients/kotlin && ./gradlew --no-daemon test
      - name: fetch pinned upstream
        run: |
          mkdir -p upstream
          git clone --quiet https://github.com/TangSengDaoDao/TangSengDaoDaoAndroid.git upstream/TangSengDaoDaoAndroid
      - name: Android SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" > /dev/null
      - name: Build (policy gate, audit, assembleDebug, unit tests)
        timeout-minutes: 30
        run: bash tools/build_android.sh "$RUNNER_TEMP/android1"
      - name: Reproducibility - a second clean build gives the same APK hash
        timeout-minutes: 30
        run: |
          a=$(VG_SKIP_AUDIT=1 bash tools/build_android.sh "$RUNNER_TEMP/android2" | sed -n 's/.*apk sha256 //p')
          b=$(VG_SKIP_AUDIT=1 bash tools/build_android.sh "$RUNNER_TEMP/android3" | sed -n 's/.*apk sha256 //p')
          echo "$a $b"; test -n "$a" && test "$a" = "$b"

  design:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python3 -I packages/design-tokens/build.py
      - run: python3 -I tools/build_icons.py
      - run: python3 -I tools/lint_no_emoji_nav.py apps
