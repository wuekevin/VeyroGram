plugins { id 'com.android.application' }
android {
    namespace 'app.veyrogram.improbe'
    compileSdk 36
    defaultConfig {
        applicationId 'app.veyrogram.improbe'
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName '1'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes { debug { manifestPlaceholders = [:] } }
}
dependencies {
    // The EXACT SDK version the Android client ships (wkbase/build.gradle). tools/ci keeps the two in step by check_sdk_versions.
    implementation 'com.github.WuKongIM:WuKongIMAndroidSDK:1.5.0'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
}
