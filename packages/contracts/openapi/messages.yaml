openapi: 3.1.0
info:
  title: VeyroGram Messages API
  version: 1.0.0
  description: |
    One-to-one messaging (Story 1.15, ARCHITECTURE AD-4/AD-21).
    **Ordinary chat messages are sent by the client SDK straight to the IM (WuKongIM)**; the IM calls our synchronous `msg.before_send` hook, which applies the same
    send policy as this API. `POST /v1/messages` carries business extension messages and is the same path for server-side callers; it is mounted together with
    the auth routes (feature flag `auth.sms_login`).

    ## Reason codes (what a client sees in SENDACK / JSON-RPC error code, and the matching API error)
    | code | meaning | API |
    |---|---|---|
    | 128 | conversation type not supported yet (groups arrive with their own story) or not a participant | 422 `unsupported_channel` |
    | 129 | sender account missing or disabled | 403 `sender_unavailable` |
    | 130 | recipient missing/disabled (also the system account) | 404 `recipient_unavailable` |
    | 131 | payload is not a JSON object with an integer `type`, or text is empty / over 4000 characters | 400 `invalid_payload` |
    | 132 | payload over 16 KiB | 413 `payload_too_large` |
    | 133 | this account is sending too fast (per-sender window, default 30 per 10 s; `Retry-After` on the API) | 429 `rate_limited` |
    | 200 | the policy could not be evaluated in time (fail-closed): retry later with the **same** `client_msg_no` | 503 `policy_unavailable` |
    | IM native (e.g. 25 = send-banned) | refused by the IM before our hook | 403 `muted` / `message_rejected` |

    Idempotency: `client_msg_no` is the client-generated ULID. The IM de-duplicates on (sender, `client_msg_no`, channel); a retry of the same message returns the
    same `message_id`/`message_seq` and is delivered once. Unknown content types are accepted (clients degrade them); they are never rejected by the server.
servers:
  - url: /
paths:
  /v1/messages:
    post:
      operationId: sendMessage
      summary: Send a one-to-one message
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SendRequest' }
      responses:
        '200':
          description: Accepted by the IM (also the answer to a retry of an already accepted message).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SendResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429':
          description: Rate limited (reason 133). Retry after the `Retry-After` seconds with the same `client_msg_no`.
          headers:
            Retry-After: { schema: { type: integer } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503': { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer }
  schemas:
    SendRequest:
      type: object
      additionalProperties: false
      required: [to_uid, client_msg_no, payload]
      properties:
        to_uid: { type: string, pattern: '^[A-Za-z0-9_-]{1,40}$' }
        client_msg_no:
          type: string
          description: A ULID generated by the client once per message and reused on every retry.
          pattern: '^[0-7][0-9A-HJKMNP-TV-Z]{25}$'
        payload:
          type: object
          required: [type]
          description: Content-type registry envelope. `type` 1 is text and needs a non-empty string `content` (max 4000 characters). Max 16 KiB overall.
          properties:
            type: { type: integer, minimum: 1 }
          additionalProperties: true
    SendResponse:
      type: object
      required: [message_id, message_seq, client_msg_no]
      properties:
        message_id: { type: string }
        message_seq: { type: integer, minimum: 1 }
        client_msg_no: { type: string }
    Error:
      type: object
      required: [code, message, trace_id]
      properties:
        code:
          type: string
          description: invalid_request, invalid_token, muted, message_rejected, sender_unavailable, recipient_unavailable, rate_limited, invalid_payload, payload_too_large, unsupported_channel, policy_unavailable, im_unavailable, internal
        message: { type: string }
        trace_id: { type: string }
        details: { type: array, items: { type: string } }
  responses:
    Error:
      description: Error envelope.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
